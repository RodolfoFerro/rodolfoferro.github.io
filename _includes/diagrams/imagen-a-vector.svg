<svg class="d-svg" viewBox="0 0 960 285" role="img" aria-labelledby="imagen-a-vector-t" xmlns="http://www.w3.org/2000/svg"><title id="imagen-a-vector-t">Una imagen de 64 × 64 × 3 pasa por el codificador de CLIP y se convierte en un vector de 512 números</title>
<defs>
