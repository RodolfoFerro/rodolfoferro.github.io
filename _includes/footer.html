<footer class="site-footer">
    <div class="status-strip">
        {% if site.status %}<span><span class="dot">●</span> <b>STATUS:</b> {{ site.status }}</span>{% endif %}
        {% if site.location %}<span><b>LOC:</b> {{ site.location }}</span>{% endif %}
        {% if site.timezone %}<span><b>TZ:</b> {{ site.timezone }}</span>{% endif %}
        <span><b>BUILD:</b> jekyll</span>
    </div>

    <div class="footer-main">
        <span class="copyright">{{ site.title }} © {{ site.time | date: '%Y' }}</span>

        <a class="link" href="/feed.xml" target="_blank" alt="anchor link to rss feed" aria-label="anchor link to rss feed">
            <i class="fa-solid fa-rss"></i>
        </a>
    </div>
</footer>
