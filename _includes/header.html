{% if page.title == "Home"
   or page.title == "Blog"
   or page.title == "Projects"
   or page.title == "Talks"
   or page.title == "Tags"
%}{% assign showHeader = true %}{% endif %}

<header class="site-bar">
    <div class="bar-inner">
        <a class="brand" href="/">{{ site.title | downcase | remove: ' ' }}<span class="cursor"></span></a>
        {% include nav.html %}
        <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav">[menu]</button>
        <button class="theme-toggle" id="themeToggle" type="button">[auto]</button>
    </div>
</header>
